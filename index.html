<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SKAN</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    @font-face {
      font-family: 'Arial Black Fallback';
      src: local('Arial Black');
    }

    html, body {
      height: 100%;
      font-family: 'Helvetica Neue', Arial, sans-serif;
      background: #1A1108;
    }

    .page {
      position: relative;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
      overflow: hidden;
    }

    /* background video (muted, looping) */
    .page-video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center center;
      z-index: 0;
      pointer-events: none;
    }

    @media (prefers-reduced-motion: reduce) {
      .page-video { display: none; }
    }

    .logo {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 2;
      font-family: 'Helvetica Neue', Arial, sans-serif;
      font-weight: 800;
      font-size: clamp(3.5rem, 11vw, 8rem);
      letter-spacing: .05em;
      color: #F2EBD9;
      text-shadow: 0 4px 30px rgba(0,0,0,0.45);
      user-select: none;
    }

    /* darken bottom for legibility of icon row */
    .page::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(to bottom, rgba(0,0,0,0.15) 0%, rgba(0,0,0,0) 40%, rgba(15,8,3,0.55) 80%, rgba(10,5,2,0.85) 100%);
      pointer-events: none;
      z-index: 1;
    }

    .content {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-bottom: 6vh;
      width: 100%;
    }

    .links {
      display: flex;
      gap: 2.2rem;
      margin-bottom: 2.4rem;
      flex-wrap: wrap;
      justify-content: center;
      padding: 0 1.5rem;
    }

    .links a {
      color: #F2EBD9;
      text-decoration: none;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 46px;
      height: 46px;
      border: 1px solid rgba(242,235,217,0.35);
      border-radius: 50%;
      transition: border-color .25s, background .25s, transform .25s;
    }

    .links a:hover {
      border-color: #C4793A;
      background: rgba(196,121,58,0.15);
      transform: translateY(-3px);
    }

    .links svg {
      width: 19px;
      height: 19px;
      fill: #F2EBD9;
    }

    .email {
      font-size: .8rem;
      letter-spacing: .1em;
      color: #D4B483;
      text-decoration: none;
      border-bottom: 1px solid transparent;
      transition: border-color .25s, color .25s;
      padding-bottom: 2px;
    }

    .email:hover {
      color: #F2EBD9;
      border-color: #C4793A;
    }

    @media (max-width: 480px) {
      .links { gap: 1.4rem; }
      .links a { width: 42px; height: 42px; }
    }
  </style>
</head>
